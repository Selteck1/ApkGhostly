name: Build PhoneToOBS APK

on:
  push:
    branches: [ phone-to-obs-mvp ]
    paths:
      - 'phone-to-obs/**'
      - '.github/workflows/phone-to-obs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: phone-to-obs
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneToOBS-debug-apk
          path: phone-to-obs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-to-obs-v0.1.0
          name: PhoneToOBS v0.1.0
          prerelease: true
          body: |
            Initial PhoneToOBS Android streaming MVP.
            Build artifact: debug APK. Device compatibility and stream stability still require testing.
          files: phone-to-obs/app/build/outputs/apk/debug/app-debug.apk
