name: Build Kemtiz Android APK 3.0.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "kemtiz-messenger" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Android-3.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Package Windows PC server
        run: |
          mkdir -p dist/Kemtiz-PC-Server/kemtiz
          cp kemtiz/server.py kemtiz/requirements.txt dist/Kemtiz-PC-Server/kemtiz/
          cp start_kemtiz_server.bat start_kemtiz_public.bat start_kemtiz_tunnel.bat README_PC_SERVER_RU.md FIREBASE_PUSH_SETUP_RU.md dist/Kemtiz-PC-Server/
          cat > dist/Kemtiz-PC-Server/START_HERE.txt <<'EOF'
          KEMTIZ PC SERVER 3.0.0
          1. Install Python 3.12+ for Windows.
          2. Start start_kemtiz_server.bat and keep the window open.
          3. For same Wi-Fi, enter http://<PC IPv4>:8000 in Kemtiz -> SVOY SERVER.
          4. For friends outside your Wi-Fi, install/sign into Tailscale and run start_kemtiz_public.bat.
          5. Kemtiz 3.0 defaults to the saved Tailscale URL; custom URLs are remembered on-device.
          6. Read README_PC_SERVER_RU.md and FIREBASE_PUSH_SETUP_RU.md for one-time Firebase push setup.
          EOF
          (cd dist && zip -qr Kemtiz-PC-Server.zip Kemtiz-PC-Server)
      - name: Upload Windows PC server package
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-PC-Server-3.0.0
          path: dist/Kemtiz-PC-Server.zip
