name: Publish content catalog

on:
  # Content publication is handled by Lineup-Publish.bat, which commits the
  # package, catalog, and policy atomically. Keep this workflow manual to avoid
  # racing a second catalog commit against that publication.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate catalog
        run: python scripts/build_catalog.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/catalog.json content/policy.json; then
            echo "Catalog and policy already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json content/policy.json
          git commit -m "Update Lineup content catalog"
          git push origin HEAD:main
