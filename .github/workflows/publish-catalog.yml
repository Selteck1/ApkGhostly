name: Publish content catalog

on:
  push:
    branches: [main]
    paths:
      - 'content/packs/*.lineup'
      - 'scripts/build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate catalog
        run: python scripts/build_catalog.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/catalog.json; then
            echo "Catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json
          git commit -m "Update Lineup content catalog"
          git push
