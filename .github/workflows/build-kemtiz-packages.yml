name: Build Kemtiz Android

concurrency:
  group: kemtiz-android-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["kemtiz-messenger"]
    paths:
      - "kemtiz/server.py"
      - "kemtiz/requirements.txt"
      - "kemtiz/web/**"
      - "app/src/main/java/com/kemtiz/app/KemtizActivity.java"
      - "app/src/main/res/xml/network_security_config.xml"
      - "app/src/main/res/drawable/ic_kemtiz_foreground.xml"
      - "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
      - "assets/ghostly_intro.mp4.b64"
      - ".github/workflows/build-kemtiz-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK with stable signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android debug key directory
        run: mkdir -p "$HOME/.android"

      - name: Restore stable Kemtiz debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kemtiz-release-signing-key-v2

      - name: Create stable debug signing key if missing
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -storetype JKS -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore embedded intro video
        run: |
          mkdir -p app/src/main/res/raw
          base64 --decode assets/ghostly_intro.mp4.b64 > app/src/main/res/raw/ghostly_intro.mp4
          test -s app/src/main/res/raw/ghostly_intro.mp4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Print Android OAuth SHA-1 fingerprint
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee android-signature.txt
          SHA1="$(awk '/certificate SHA-1 digest:/{print $NF; exit}' android-signature.txt)"
          test -n "$SHA1"
          SHA1_COLON="$(printf '%s' "$SHA1" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          printf 'SHA-1 for Google Cloud: %s\nRaw SHA-1: %s\n' "$SHA1_COLON" "$SHA1" | tee Android-OAuth-SHA1.txt
          {
            echo "### Android OAuth fingerprint"
            echo
            echo "\`$SHA1_COLON\`"
            echo
            echo "Android package: com.kemtiz.app"
            echo "Copy this SHA-1 into the Android OAuth client in Google Cloud."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare Android release files
        run: |
          mkdir -p android-release
          cp app/build/outputs/apk/debug/app-debug.apk android-release/Kemtiz-Android.apk
          cp Android-OAuth-SHA1.txt android-release/Android-OAuth-SHA1.txt

      - name: Upload Android APK and OAuth fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Android
          path: android-release/*
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    name: Publish downloadable Android APK
    if: github.ref == 'refs/heads/kemtiz-messenger'
    needs: [android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kemtiz-Android
          path: release-assets

      - name: Prepare release files
        run: |
          ls -lh release-assets
          test -s release-assets/Kemtiz-Android.apk
          test -s release-assets/Android-OAuth-SHA1.txt

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kemtiz-android-${{ github.run_number }}
          target_commitish: kemtiz-messenger
          name: "Kemtiz Android preview #${{ github.run_number }}"
          body: |
            Kemtiz Android preview build from branch kemtiz-messenger.

            - Install Kemtiz-Android.apk on the phone.
            - On first launch, enter the shared HTTPS server URL.
            - Deploy the API and PostgreSQL database using render.yaml and kemtiz/DEPLOY.md before signing in.
            - The Android OAuth SHA-1 fingerprint is included as Android-OAuth-SHA1.txt.
            - Android releases are serialized and use a dedicated cached CI debug signing key; verify the SHA-1 fingerprint for OAuth.
            - This is an early test build without end-to-end encryption or full account recovery.
          prerelease: true
          make_latest: false
          files: |
            release-assets/Kemtiz-Android.apk
            release-assets/Android-OAuth-SHA1.txt
