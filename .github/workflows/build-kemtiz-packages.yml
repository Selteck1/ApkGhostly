name: Build Kemtiz Desktop and Android

on:
  push:
    branches: ["kemtiz-messenger"]
    paths:
      - "README.md"
      - "render.yaml"
      - "kemtiz/DEPLOY.md"
      - "kemtiz/desktop/**"
      - "kemtiz/server.py"
      - "kemtiz/requirements.txt"
      - "kemtiz/web/**"
      - "app/src/main/java/com/kemtiz/app/KemtizActivity.java"
      - "app/src/main/res/xml/network_security_config.xml"
      - "app/src/main/res/drawable/ic_kemtiz_foreground.xml"
      - "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
      - "assets/ghostly_intro.mp4.b64"
      - ".github/workflows/build-kemtiz-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kemtiz/requirements.txt
            kemtiz/desktop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r kemtiz/requirements.txt -r kemtiz/desktop/requirements.txt

      - name: Generate Kemtiz icon
        run: python kemtiz/desktop/make_icon.py

      - name: Validate Python sources
        run: python -m compileall -q kemtiz/server.py kemtiz/desktop/launcher.py kemtiz/desktop/make_icon.py

      - name: Package Kemtiz.exe
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Kemtiz
          --icon kemtiz/desktop/kemtiz.ico
          --paths kemtiz
          --collect-all PySide6
          --collect-all shiboken6
          kemtiz/desktop/launcher.py

      - name: Include desktop instructions
        run: Copy-Item kemtiz/desktop/README.md dist/README-Desktop.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not installed." }
          & $compiler "kemtiz\desktop\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\Kemtiz-Setup.exe")) { throw "Kemtiz-Setup.exe was not created." }

      - name: Upload Windows EXE and installer
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Desktop-Windows
          path: |
            dist/Kemtiz.exe
            dist/Kemtiz-Setup.exe
            dist/README-Desktop.txt
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Build Android APK with LAN support
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore embedded intro video
        run: |
          mkdir -p app/src/main/res/raw
          base64 --decode assets/ghostly_intro.mp4.b64 > app/src/main/res/raw/ghostly_intro.mp4
          test -s app/src/main/res/raw/ghostly_intro.mp4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Print Android OAuth SHA-1 fingerprint
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee android-signature.txt
          SHA1="$(awk '/certificate SHA-1 digest:/{print $NF; exit}' android-signature.txt)"
          test -n "$SHA1"
          SHA1_COLON="$(printf '%s' "$SHA1" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          printf 'SHA-1 for Google Cloud: %s\nRaw SHA-1: %s\n' "$SHA1_COLON" "$SHA1" | tee Android-OAuth-SHA1.txt
          {
            echo "### Android OAuth fingerprint"
            echo
            echo "\`$SHA1_COLON\`"
            echo
            echo "Copy the colon-separated SHA-1 into Google Cloud → Android OAuth client for package com.kemtiz.app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Android release files
        run: |
          mkdir -p android-release
          cp app/build/outputs/apk/debug/app-debug.apk android-release/Kemtiz-Android-LAN.apk
          cp Android-OAuth-SHA1.txt android-release/Android-OAuth-SHA1.txt

      - name: Upload Android APK and OAuth fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Android-LAN
          path: android-release/*
          if-no-files-found: error
          retention-days: 30

  publish-preview-release:
    name: Publish downloadable preview
    if: github.ref == 'refs/heads/kemtiz-messenger'
    needs: [windows-desktop, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release files
        run: |
          ls -lh release-assets

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kemtiz-desktop-${{ github.run_number }}
          name: "Kemtiz Desktop preview #${{ github.run_number }}"
          body: |
            Kemtiz preview build from branch kemtiz-messenger.

            - Kemtiz-Setup.exe installs Kemtiz and creates a desktop shortcut; Kemtiz.exe is the portable build.
            - Desktop login is confirmed by scanning the short-lived QR code in the Android app.
            - For the local preview, point the Android app at the PC server's private LAN address and keep both devices on trusted Wi-Fi.
            - This preview does not provision a public HTTPS server. Never expose port 8000 directly to the internet; LAN HTTP is not encrypted.
          prerelease: true
          make_latest: false
          files: |
            release-assets/Kemtiz.exe
            release-assets/Kemtiz-Setup.exe
            release-assets/README-Desktop.txt
            release-assets/Kemtiz-Android-LAN.apk
            release-assets/Android-OAuth-SHA1.txt
