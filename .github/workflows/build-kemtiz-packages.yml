name: Build Kemtiz Desktop and Android

on:
  push:
    branches: ["kemtiz-messenger"]
    paths:
      - "kemtiz/desktop/**"
      - "kemtiz/server.py"
      - "kemtiz/requirements.txt"
      - "kemtiz/web/**"
      - "app/src/main/java/com/kemtiz/app/KemtizActivity.java"
      - "app/src/main/res/xml/network_security_config.xml"
      - "assets/ghostly_intro.mp4.b64"
      - ".github/workflows/build-kemtiz-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kemtiz/requirements.txt
            kemtiz/desktop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r kemtiz/requirements.txt -r kemtiz/desktop/requirements.txt

      - name: Generate Kemtiz icon
        run: python kemtiz/desktop/make_icon.py

      - name: Validate Python sources
        run: python -m compileall -q kemtiz/server.py kemtiz/desktop/launcher.py kemtiz/desktop/make_icon.py

      - name: Package Kemtiz.exe
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Kemtiz
          --icon kemtiz/desktop/kemtiz.ico
          --paths kemtiz
          --add-data "kemtiz/server.py;."
          --add-data "kemtiz/web;web"
          --collect-submodules uvicorn
          kemtiz/desktop/launcher.py

      - name: Include desktop instructions
        run: Copy-Item kemtiz/desktop/README.md dist/README-Desktop.txt

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Desktop-Windows
          path: |
            dist/Kemtiz.exe
            dist/README-Desktop.txt
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Build Android APK with LAN support
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore embedded intro video
        run: |
          mkdir -p app/src/main/res/raw
          base64 --decode assets/ghostly_intro.mp4.b64 > app/src/main/res/raw/ghostly_intro.mp4
          test -s app/src/main/res/raw/ghostly_intro.mp4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Kemtiz-Android-LAN
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-preview-release:
    name: Publish downloadable preview
    if: github.ref == 'refs/heads/kemtiz-messenger'
    needs: [windows-desktop, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release files
        run: |
          mv release-assets/app-debug.apk release-assets/Kemtiz-Android-LAN.apk
          ls -lh release-assets

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kemtiz-desktop-${{ github.run_number }}
          name: Kemtiz Desktop preview #${{ github.run_number }}
          body: |
            Kemtiz preview build from branch kemtiz-messenger.

            - Kemtiz.exe is the Windows desktop app and runs the server on the PC.
            - Kemtiz-Android-LAN.apk supports a private-LAN HTTP server address.
            - Keep both devices on the same trusted Wi-Fi. Do not expose port 8000 to the public internet; LAN HTTP is not encrypted.
          prerelease: true
          make_latest: false
          files: |
            release-assets/Kemtiz.exe
            release-assets/README-Desktop.txt
            release-assets/Kemtiz-Android-LAN.apk
