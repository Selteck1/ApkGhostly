name: Build Lineup admin and user APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare embedded client content
        run: python scripts/prepare_client_assets.py
      - name: Build both debug APKs
        run: |
          REVISION="$(python -c 'import json; print(json.load(open("content/catalog.json"))["revision"])')"
          gradle assembleDebug -PcontentRevision="$REVISION" -PbuildVersionCode=1
      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: lineup-admin-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: lineup-user-apk-debug
          path: client/build/outputs/apk/debug/client-debug.apk
          if-no-files-found: error
          retention-days: 30
