
name: Build Ghostly Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostly-server-1.0.0
          path: build/libs/ghostly-server-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ghostly Server v1.0.0
          body: |
            Ghostly Server for Minecraft Java 1.20.1 + Forge.

            The installer ZIP separately downloads Playit Companion, which provides the public TCP tunnel. On first use, follow the Playit claim URL shown in Minecraft chat.
          files: build/libs/ghostly-server-1.0.0.jar
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
