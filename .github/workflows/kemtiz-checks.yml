name: Kemtiz backend checks

on:
  workflow_dispatch:
  push:
    branches: [ "main", "kemtiz-messenger" ]
  pull_request:
    branches: [ "main", "kemtiz-messenger" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kemtiz/requirements.txt
      - name: Verify WebSocket support is installed
        run: python -c "import websockets; print('WebSocket runtime OK:', websockets.__version__)"
      - name: Compile backend
        run: python -m compileall -q kemtiz
      - name: Check native Android client
        run: |
          ! grep -R "WebView" app/src/main/java/com/kemtiz/app
          test ! -f app/src/main/assets/kemtiz/app.js
          test ! -f app/src/main/assets/kemtiz/index.html
      - name: Test API flow
        working-directory: kemtiz
        run: python -m unittest -v test_server
