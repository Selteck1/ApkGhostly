name: Kemtiz backend checks

on:
  workflow_dispatch:
  push:
    branches: [ "main", "kemtiz-messenger" ]
  pull_request:
    branches: [ "main", "kemtiz-messenger" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kemtiz/requirements.txt
      - name: Compile backend
        run: python -m compileall -q kemtiz
      - name: Check native Android client
        run: |
          ! grep -R "WebView" app/src/main/java/com/kemtiz/app
          test ! -f app/src/main/assets/kemtiz/app.js
          test ! -f app/src/main/assets/kemtiz/index.html
      - name: Test API flow
        working-directory: kemtiz
        run: python -m unittest -v test_server
      - name: Verify live Render registration service
        env:
          KEMTIZ_API_BASE: https://kemtiz-api.onrender.com
        run: |
          set -uo pipefail
          echo "Checking live Kemtiz health endpoint..."
          health="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 8 --max-time 45 "$KEMTIZ_API_BASE/health" || true)"
          echo "Live /health response: $health"

          echo "Checking live password registration route..."
          status="$(curl --silent --show-error --output /tmp/kemtiz-register-check.json --write-out '%{http_code}' \
            --max-time 45 -X POST "$KEMTIZ_API_BASE/api/auth/password/register" \
            -H 'Content-Type: application/json' \
            --data '{"username":"x","password":"x"}' || true)"
          echo "Registration endpoint HTTP status: $status"
          cat /tmp/kemtiz-register-check.json 2>/dev/null || true

          HEALTH_JSON="$health" STATUS="$status" python - <<'PY'
          import json
          import os
          payload = json.loads(os.environ.get("HEALTH_JSON", "{}") or "{}")
          status = os.environ.get("STATUS", "")
          errors = []
          if payload.get("api_version") != "0.3.0":
              errors.append(
                  "Render is serving an old backend: expected api_version 0.3.0. "
                  "Set the existing Render service Root Directory to 'kemtiz' "
                  "and deploy the latest main commit."
              )
          if payload.get("password_auth") is not True:
              errors.append("Live /health does not report password_auth=true.")
          if status != "422":
              errors.append(
                  "Password registration route did not validate test input with HTTP 422; "
                  f"actual status was {status or 'no response'}. The live backend is not the expected build."
              )
          if errors:
              raise SystemExit("\\n".join(errors))
          print("Live Render registration route verified.")
          PY
