name: Ghostly Screen Recorder Android

on:
  push:
    branches:
      - main
      - feature/android-screen-recorder
      - feature/ghostly-rec-engine-ads
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
      - '.gitmodules'
  pull_request:
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Ghostly Recorder APK (FluxRecorder engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and pinned source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Ghostly branding and App Open ads
        env:
          GHOSTLY_ADMOB_APP_ID: ${{ vars.GHOSTLY_ADMOB_APP_ID }}
          GHOSTLY_APP_OPEN_AD_UNIT_ID: ${{ vars.GHOSTLY_APP_OPEN_AD_UNIT_ID }}
        run: |
          python3 screen-recorder/patches/apply_ghostly.py screen-recorder/rec-upstream

      - name: Build debug APK
        run: gradle -p screen-recorder/rec-upstream --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostlyScreenRecorder-FluxEngine-debug
          path: screen-recorder/rec-upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
