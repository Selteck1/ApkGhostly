name: Ghostly Screen Recorder Android

on:
  push:
    branches:
      - main
      - feature/rec-engine-app-open-ads
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
  pull_request:
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Ghostly Recorder from pinned REC source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ApkGhostly and Ghostly patch
        uses: actions/checkout@v4

      - name: Checkout pinned open-source REC recorder
        uses: actions/checkout@v4
        with:
          repository: pixl-hq/rec
          ref: 0c855ef7a73111be394d5306302dd0b29245272d
          path: .ci/rec-upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply Ghostly branding and App Open ad integration
        run: python3 screen-recorder/patch_rec_build.py --project .ci/rec-upstream

      - name: Build debug APK
        run: gradle -p .ci/rec-upstream --no-daemon assembleDebug

      - name: Upload Ghostly Recorder APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostlyScreenRecorder-REC-engine-debug
          path: .ci/rec-upstream/app/build/outputs/apk/debug/GhostlyScreenRecorder-v*-debug.apk
          if-no-files-found: error
          retention-days: 14
