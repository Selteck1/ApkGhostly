name: Ghostly Screen Recorder Android

on:
  push:
    branches:
      - main
      - feature/android-screen-recorder
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
  pull_request:
    paths:
      - 'screen-recorder/**'
      - '.github/workflows/screen-recorder-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build debug APK
        run: gradle -p screen-recorder --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostlyScreenRecorder-debug
          path: screen-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
