name: Ghostly App Dumper Android

on:
  push:
    branches:
      - main
      - feature/installed-app-dumper
    paths:
      - 'app-dumper/**'
      - '.github/workflows/installed-app-dumper-android.yml'
  pull_request:
    paths:
      - 'app-dumper/**'
      - '.github/workflows/installed-app-dumper-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build debug APK
        run: gradle -p app-dumper --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostlyAppDumper-debug
          path: app-dumper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
