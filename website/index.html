<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostly — Standoff 2</title>
  <meta name="description" content="Ghostly — поиск игроков Standoff 2, анкеты, команды и игровые возможности. Открой Ghostly в Telegram.">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Ghostly — Standoff 2">
  <meta property="og:description" content="Открыть Ghostly в Telegram">
  <meta name="theme-color" content="#0b0b10">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#08080d;color:#f5f5f7;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
    .wrap{width:min(680px,92vw);text-align:center;padding:34px}
    .ghost{font-size:64px;margin-bottom:10px}
    h1{font-size:42px;margin:0 0 12px}
    p{color:#b7b7c3;font-size:18px;line-height:1.6;margin:0 auto 26px;max-width:560px}
    a{display:inline-flex;align-items:center;justify-content:center;min-width:240px;padding:15px 22px;border-radius:14px;background:#fff;color:#08080d;text-decoration:none;font-weight:700}
    .small{margin-top:20px;font-size:14px;color:#777785}
    .small code{color:#9c9cac}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="ghost">👻</div>
    <h1>GHOSTLY</h1>
    <p>Платформа для игроков Standoff 2: поиск игроков, анкеты, команды и будущий соревновательный режим.</p>
    <a href="https://t.me/Ghostlyso2Bot">🎮 Открыть Ghostly в Telegram</a>
    <div class="small">Переход в Telegram через <span id="timer">5</span> сек.</div>
  </main>
  <script>
    let seconds = 5;
    const timer = document.getElementById('timer');
    const tick = () => {
      seconds -= 1;
      timer.textContent = String(Math.max(seconds, 0));
      if (seconds <= 0) window.location.href = 'https://t.me/Ghostlyso2Bot';
    };
    setInterval(tick, 1000);
  </script>
</body>
</html>
