plugins {
    id "com.android.application"
}

android {
    namespace "com.ghostly.apk"
    compileSdk 35

    buildFeatures {
        aidl true
    }

    defaultConfig {
        applicationId "com.ghostly.apk"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "1.4.0"
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
