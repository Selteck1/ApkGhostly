plugins {
    id "com.android.application"
}

android {
    namespace "com.kemtiz.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.kemtiz.app"
        minSdk 26
        targetSdk 35
        // Release workflow passes a monotonically increasing GitHub Actions run number.
        versionCode = (project.findProperty("versionCode") ?: "17").toString().toInteger()
        versionName "2.0.0"
    }

    // CI sets this explicitly so release APKs use the same signing key.
    // Local development keeps Android Gradle Plugin's usual debug-signing behavior.
    def stableCiKeystore = System.getenv("KEMTIZ_STABLE_DEBUG_KEYSTORE")
    if (stableCiKeystore) {
        signingConfigs {
            stableCi {
                storeFile file(stableCiKeystore)
                storeType "JKS"
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.stableCi
            }
        }
    }
}

dependencies {
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
