plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.selteck.lineup'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.selteck.lineup.admin'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('LINEUP_KEYSTORE_PATH')
            def ksPassword = System.getenv('LINEUP_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('LINEUP_KEY_ALIAS')
            def keyPasswordValue = System.getenv('LINEUP_KEY_PASSWORD')
            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('LINEUP_KEYSTORE_PATH') &&
                System.getenv('LINEUP_KEYSTORE_PASSWORD') &&
                System.getenv('LINEUP_KEY_ALIAS') &&
                System.getenv('LINEUP_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
