services:
  - type: web
    name: kemtiz-api
    runtime: python
    plan: free
    branch: main
    rootDir: kemtiz
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: KEMTIZ_SECRET
        generateValue: true
